[package]
name = "cobblestone-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
cobblestone = { path = "..", features = ["cobblestone-256"] }
libfuzzer-sys = "0.4"

# Keeps this crate out of any workspace, as cargo-fuzz requires.
[workspace]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tamper"
path = "fuzz_targets/tamper.rs"
test = false
doc = false
bench = false

[[bin]]
name = "random_access"
path = "fuzz_targets/random_access.rs"
test = false
doc = false
bench = false

[[bin]]
name = "untrusted_input"
path = "fuzz_targets/untrusted_input.rs"
test = false
doc = false
bench = false
